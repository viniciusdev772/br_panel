name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatação
        run: test -z "$(gofmt -l cmd internal web tools)"
      - name: Vet
        run: go vet ./...
      - name: Testes (com detector de corrida)
        run: go test -race -coverprofile=coverage.out ./internal/... ./tools/...
      - name: Build
        run: go build -trimpath -o bin/brpanel ./cmd/brpanel

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
